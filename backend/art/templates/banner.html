<!doctype html><html><head><meta charset="utf-8"><style>
$css
body { width: 1280px; height: 640px; }
.title { position: absolute; left: 64px; top: 54px; font-size: 92px; line-height: 0.92;
         letter-spacing: -0.025em; }
.promise { position: absolute; left: 66px; top: 158px; font-size: 30px; letter-spacing: -0.005em; }
.strip .edge { font-size: 11.5px; padding-left: 4px; }
.strip .hole { width: 12px; height: 9px; border-radius: 2px; opacity: 0.92; }
.strip .holes.top { top: 6px; }
.strip .holes.bottom { bottom: 15px; }
.note { position: absolute; left: ${note_left}px; top: ${note_top}px; width: 340px; }
.note q { display: block; font-size: 32px; font-weight: 650; font-stretch: 112%;
          letter-spacing: -0.01em; quotes: "\201C" "\201D"; }
.note span { display: block; margin-top: 6px; font-size: 15px; line-height: 1.4;
             color: var(--graphite); }
.result { position: absolute; left: 64px; top: 548px; width: 620px; }
.result b { display: block; font-size: 21px; font-weight: 650; }
.result span { display: block; margin-top: 6px; font-size: 15.5px; line-height: 1.45;
               color: var(--graphite); }
.credits { position: absolute; right: 64px; top: 552px; width: 430px; text-align: right;
           font-size: 14.5px; line-height: 1.45; color: var(--graphite); }
</style></head><body>
<div class="title display">Trained Eye</div>
<div class="promise">Teach your glasses to notice anything.</div>
$strip
$ring
<div class="note"><q>$alert</q><span>$when</span></div>
<div class="result"><b>$headline</b><span>$detail</span></div>
<div class="credits">$credits</div>
</body></html>
