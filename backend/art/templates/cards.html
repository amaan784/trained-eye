<!doctype html><html><head><meta charset="utf-8"><style>
$css
body { width: 1280px; height: $height; overflow: hidden; padding: 40px 56px; }
h2 { font-size: 30px; font-weight: 600; letter-spacing: -0.01em; }
.row { margin-top: 24px; display: flex; gap: 14px; }
.card { flex: 1; min-width: 0; min-height: 290px; border-radius: var(--corner); background: var(--surface);
        border: 1px solid var(--rule); padding: 22px 20px; display: flex; flex-direction: column; }
.card.on { border: 2px solid var(--accent); }
.card .name { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.card .id { margin-top: 4px; font-size: 12px; color: var(--secondary); overflow-wrap: anywhere;
            font-family: ui-monospace, Menlo, monospace; }
.card .what { margin-top: 14px; font-size: 15px; line-height: 1.45; }
.card .count { margin-top: auto; padding-top: 16px; font-size: 14px; font-weight: 500;
               color: var(--accent); }
.badge { align-self: flex-start; margin-bottom: 12px; padding: 4px 10px; border-radius: 999px;
         background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 600;
         letter-spacing: 0.04em; }
</style></head><body>
<h2>Meta models, each with a job</h2>
<div class="row">$cards</div>
</body></html>
