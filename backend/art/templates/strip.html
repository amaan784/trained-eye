<!doctype html><html><head><meta charset="utf-8"><style>
$css
body { width: 1280px; height: 560px; }
h1 { position: absolute; left: 64px; top: 52px; font-size: 42px; }
.note { position: absolute; left: 64px; top: 530px; font-size: 14px; color: var(--graphite); }
ol { position: absolute; left: 760px; top: 126px; width: 456px; list-style: none;
     counter-reset: step; }
li { counter-increment: step; position: relative; padding-left: 38px; margin-bottom: 20px;
     font-size: 17px; line-height: 1.45; }
li::before { content: counter(step); position: absolute; left: 0; top: -2px; font-size: 22px;
             font-weight: 800; font-stretch: 125%; color: var(--marker); }
li b { font-weight: 650; }
q { quotes: "\201C" "\201D"; }
</style></head><body>
<h1 class="display">$title</h1>
$strips
<p class="note">$note</p>
<ol>$steps</ol>
</body></html>
