# XcodeGen spec for the Trained Eye iPhone app: `xcodegen generate --spec ios/project.yml`
# writes ios/TrainedEye.xcodeproj with the settings ios/README.md lists (iOS 17.2, iPhone,
# portrait, Meta's DAT 1.0.1, Swift 5, nonisolated default actor isolation, the Info.plist
# and entitlements beside the source folder). Before running on a phone, set your Team
# and bundle identifier in Signing & Capabilities.
name: TrainedEye
options:
  bundleIdPrefix: com.example.trainedeye
  deploymentTarget:
    iOS: "17.2"
packages:
  MWDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
targets:
  TrainedEye:
    type: application
    platform: iOS
    deploymentTarget: "17.2"
    sources:
      - path: TrainedEye
    dependencies:
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
      - package: MWDAT
        product: MWDATMockDevice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.trainedeye
        INFOPLIST_FILE: TrainedEye-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: TrainedEye.entitlements
        SWIFT_VERSION: "5.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme: {}
