<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clip labels</title>
<link rel="stylesheet" href="static/style.css">
<style>
  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  video { display: block; width: 100%; max-height: 66vh; background: #000; border-radius: 8px; }
  #bar { position: relative; height: 28px; margin-top: 10px; cursor: pointer; overflow: hidden;
         background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  #bar .seg, #head { position: absolute; top: 0; bottom: 0; background: var(--accent); }
  #bar .open { background: var(--soft); } #head { width: 2px; background: var(--text); }
  #time { font-variant-numeric: tabular-nums; min-width: 9em; } aside { align-self: start; }
  #list .row { gap: 6px; margin: 6px 0; flex-wrap: nowrap; }
  #list input { width: 5.5em; } #list button { padding: 4px 10px; } .keys { font-size: 13px; }
</style>
</head>
<body>
<header><b>Trained Eye</b><span>Clip labels</span><span id="clip" class="muted"></span></header>
<main>
  <section>
    <video id="v" src="video" preload="metadata" playsinline></video>
    <div id="bar" title="Click to seek"><div id="head"></div></div>
    <div class="row">
      <button id="play">Play</button><span id="time" class="muted"></span>
      <button id="start" class="primary">[ Becomes true</button>
      <button id="end" class="primary">] Stops being true</button>
    </div>
    <div class="row keys muted"><span><kbd>Space</kbd> play or pause</span>
      <span><kbd>Left</kbd> <kbd>Right</kbd> 1 s, with <kbd>Shift</kbd> 0.1 s</span>
      <span><kbd>Home</kbd> <kbd>End</kbd> start or end</span>
      <span><kbd>Ctrl</kbd> or <kbd>Cmd</kbd> + <kbd>S</kbd> save</span></div>
  </section>
  <aside class="panel">
    <h2>Where the condition is true</h2>
    <div id="list"></div>
    <div class="row"><button id="save" class="primary">Save</button>
      <span id="out" class="muted"></span></div>
    <div id="status"></div>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id), v = $("v");
let ranges = [], open = null, dirty = false;
const dur = () => (isFinite(v.duration) ? v.duration : 0);
const round = (t) => Math.min(Math.round(t * 100) / 100, dur());
const seek = (t) => { v.currentTime = Math.max(0, Math.min(t, dur())); };
const toggle = () => (v.paused ? v.play() : v.pause());
const plural = (n) => `${n} range${n === 1 ? "" : "s"}`;
const make = (tag, props) => Object.assign(document.createElement(tag), props);
const say = (text, bad) => Object.assign($("status"),
  { textContent: text, className: bad ? "bad" : "" });
function changed() { dirty = true; say("Not saved yet"); draw(); }
function draw() {
  const d = dur() || 1, segs = ranges.map((r) => [r[0], r[1], "seg"]);
  if (open !== null) segs.push([open, Math.max(open, v.currentTime), "seg open"]);
  $("bar").querySelectorAll(".seg").forEach((e) => e.remove());
  for (const [a, b, cls] of segs) {
    const e = make("div", { className: cls });
    e.style.left = (a / d) * 100 + "%"; e.style.width = (Math.max(0, b - a) / d) * 100 + "%";
    $("bar").insertBefore(e, $("head"));
  }
  $("head").style.left = (v.currentTime / d) * 100 + "%";
  $("time").textContent = `${v.currentTime.toFixed(2)} / ${dur() ? dur().toFixed(2) : "?"} s`;
  $("play").textContent = v.paused ? "Play" : "Pause";
}
function list() {
  $("list").replaceChildren(ranges.length ? "" : "None yet: press [ where it becomes true.");
  ranges.forEach((r, i) => {
    const check = () => inputs.forEach((x) =>
      x.classList.toggle("bad", !(r[0] >= 0 && r[0] < r[1] && r[1] <= dur())));
    const inputs = [0, 1].map((k) => make("input", { type: "number", step: "0.1", min: "0",
      value: r[k], ariaLabel: k ? "end, seconds" : "start, seconds",
      onchange: (e) => { r[k] = parseFloat(e.target.value); check(); changed(); } }));
    const row = make("div", { className: "row" });
    row.append(inputs[0], "to", inputs[1],
      make("button", { textContent: "Go", onclick: () => seek(r[0]) }),
      make("button", { textContent: "Delete",
        onclick: () => { ranges.splice(i, 1); list(); changed(); } }));
    $("list").append(row); check();
  });
}
function markStart() {
  open = round(v.currentTime); say(`Started at ${open} s: press ] where it stops`); draw();
}
function markEnd() {
  if (open === null) return say("Press [ first, where the condition becomes true", true);
  const t = round(v.currentTime);
  if (t <= open) return say("The end must come after the start", true);
  ranges.push([open, t]); ranges.sort((a, b) => a[0] - b[0]); open = null; list(); changed();
}
async function save() {
  if (open !== null) return say("A range is still open: press ] where it stops being true", true);
  if (!dur()) return say("The video has not loaded yet", true);
  let res, data;
  try {
    res = await fetch("labels", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ duration_s: dur(), true: ranges }) });
    data = await res.json();
  } catch (err) { return say(`Not saved: ${err}`, true); }
  if (!res.ok) return say(`Not saved: ${data.error}`, true);
  ranges = data.true; dirty = false; list(); draw();
  say(`Saved ${plural(ranges.length)} to ${data.out}`);
}
$("play").onclick = toggle; $("start").onclick = markStart; $("end").onclick = markEnd;
$("save").onclick = save;
$("bar").onclick = (e) => {
  const box = $("bar").getBoundingClientRect(); seek(((e.clientX - box.left) / box.width) * dur());
};
document.addEventListener("click", (e) => { if (e.target.tagName === "BUTTON") e.target.blur(); });
for (const ev of ["timeupdate", "seeked", "play", "pause"]) v.addEventListener(ev, draw);
v.addEventListener("loadedmetadata", () => { list(); draw(); });
v.onerror = () => say("This browser cannot play the clip: try Safari or Chrome", true);
window.onbeforeunload = (e) => {
  if (dirty || open !== null) { e.preventDefault(); e.returnValue = ""; } };
document.addEventListener("keydown", (e) => {
  const saveKey = (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s";
  if (e.target.tagName === "INPUT") {
    if (!saveKey) return;
    e.target.blur();  // applies the typed value through its change event, then saves
  }
  if (!saveKey && (e.ctrlKey || e.metaKey || e.altKey)) return;
  const step = e.shiftKey ? 0.1 : 1;
  const fn = saveKey ? save : { " ": toggle, "[": markStart, "]": markEnd, Home: () => seek(0),
    End: () => seek(dur()), ArrowLeft: () => seek(v.currentTime - step),
    ArrowRight: () => seek(v.currentTime + step) }[e.key];
  if (fn) { e.preventDefault(); fn(); }
});
fetch("labels").then((r) => r.json()).then((s) => {
  ranges = s.true; $("clip").textContent = s.clip; $("out").textContent = `Saves to ${s.out}`;
  list(); draw(); if (ranges.length) say(`Loaded ${plural(ranges.length)} from ${s.out}`);
});
</script>
</body>
</html>
