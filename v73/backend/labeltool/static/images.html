<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image labels</title>
<link rel="stylesheet" href="static/style.css">
<style>
  main { max-width: 960px; } #question { font-size: 17px; } #status, #done { text-align: center; }
  figure { margin: 16px 0 0; min-height: 60vh; display: flex; flex-direction: column;
           align-items: center; justify-content: center; gap: 8px; }
  img { display: block; max-width: 100%; max-height: 60vh; border-radius: 8px; }
  .answers { justify-content: center; } .answers button { min-width: 120px; padding: 10px 16px; }
</style>
</head>
<body>
<header><b>Trained Eye</b><span>Image labels</span><span id="progress" class="muted"></span>
</header>
<main>
  <div id="question" class="panel"></div>
  <figure id="figure"><img id="img" alt="training image">
    <figcaption id="name" class="muted"></figcaption></figure>
  <p id="done" hidden></p>
  <div class="row answers">
    <button id="yes">Yes <kbd>Y</kbd></button><button id="no">No <kbd>N</kbd></button>
    <button id="unsure">Unsure <kbd>U</kbd></button>
    <button id="back">Back <kbd>Backspace</kbd></button>
  </div>
  <div id="status"></div>
</main>
<script>
const $ = (id) => document.getElementById(id), ANSWERS = ["yes", "no", "unsure"];
let s = null, i = 0, busy = false;
const say = (text, bad) => Object.assign($("status"),
  { textContent: text, className: bad ? "bad" : "" });
function next() {  // the next image without an answer, or the end
  const n = s.images.length;
  for (let k = 1; k <= n; k++) if (!s.labels[s.images[(i + k) % n]]) return (i + k) % n;
  return n;
}
function show() {
  const n = s.images.length, end = i >= n;
  $("progress").textContent = `${s.images.filter((f) => s.labels[f]).length} of ${n} answered`;
  $("figure").hidden = end; $("done").hidden = !end;
  $("done").textContent = `All ${n} answered and saved to ${s.out}. Backspace goes back.`;
  if (!end) {
    // no file name: generated files are named for the answer they were made to show
    $("img").src = `image/${i}`; $("name").textContent = `Image ${i + 1} of ${n}`;
    if (i + 1 < n) new Image().src = `image/${i + 1}`;  // load the next one early
  }
  for (const a of ANSWERS) $(a).classList.toggle("on", !end && s.labels[s.images[i]] === a);
}
async function answer(label) {
  if (busy || i >= s.images.length) return; else busy = true;
  const name = s.images[i];  // the image answered, even if the page moves meanwhile
  try {
    const res = await fetch("answer", { method: "POST", headers: { "Content-Type":
      "application/json" }, body: JSON.stringify({ file: name, label }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    s.labels[name] = label; i = next(); say(""); show();
  } catch (err) { say(`Not saved: ${err.message}`, true); }
  busy = false;
}
function back() { if (!busy && i > 0) { i -= 1; show(); } }
for (const a of ANSWERS) $(a).onclick = () => answer(a);
$("back").onclick = back;
document.addEventListener("click", (e) => e.target.closest("button")?.blur());
document.addEventListener("keydown", (e) => {
  if (!s || e.ctrlKey || e.metaKey || e.altKey) return;
  const fn = { y: () => answer("yes"), n: () => answer("no"), u: () => answer("unsure"),
    Backspace: back }[e.key.length === 1 ? e.key.toLowerCase() : e.key];
  if (fn) { e.preventDefault(); fn(); }
});
fetch("state").then((r) => r.json()).then((state) => {
  s = state;
  $("question").textContent = s.question || "Is the skill's condition true in this image?";
  i = s.images.findIndex((f) => !s.labels[f]); if (i < 0) i = s.images.length; show();
});
</script>
</body>
</html>
